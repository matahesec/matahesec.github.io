<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | ProfitHub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: #1a0a0a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 28px;
            font-weight: 700;
            color: #fef3c7;
            margin-bottom: 40px;
            text-decoration: none;
        }

        .logo-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #f97316, #fbbf24);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: white;
        }

        .logo span { color: #f97316; }

        .login-card {
            background: #2d1515;
            border: 1px solid #5c3030;
            border-radius: 20px;
            padding: 40px;
        }

        .login-card h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 24px;
            color: #fef3c7;
            margin-bottom: 8px;
            text-align: center;
        }

        .login-card .subtitle {
            color: #d4a574;
            font-size: 14px;
            margin-bottom: 32px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #fef3c7;
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #d4a574;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px 14px 48px;
            background: #1a0a0a;
            border: 1px solid #5c3030;
            border-radius: 12px;
            font-size: 15px;
            color: #fef3c7;
            outline: none;
            transition: all 0.3s;
        }

        .form-group input:focus {
            border-color: #f97316;
        }

        .form-group input::placeholder {
            color: #d4a574;
        }

        .forgot {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 24px;
        }

        .forgot a {
            color: #f97316;
            font-size: 14px;
            text-decoration: none;
        }

        .btn {
            width: 100%;
            padding: 16px;
            background: #f97316;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn:hover {
            background: #ea580c;
            transform: translateY(-2px);
        }

        .btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 24px 0;
            color: #d4a574;
            font-size: 14px;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #5c3030;
        }

        .divider span {
            padding: 0 16px;
        }

        .social-login {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }

        .social-btn {
            flex: 1;
            padding: 12px;
            background: #1a0a0a;
            border: 1px solid #5c3030;
            border-radius: 10px;
            color: #fef3c7;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .social-btn span {
            font-size: 13px;
        }

        .social-btn:hover {
            background: #2d1515;
            border-color: #f97316;
        }

        .register-link {
            text-align: center;
            margin-top: 24px;
            color: #d4a574;
            font-size: 14px;
        }

        .register-link a {
            color: #f97316;
            text-decoration: none;
            font-weight: 500;
        }

        .error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid #ef4444;
            color: #ef4444;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 14px;
            margin-bottom: 20px;
            display: none;
        }

        .error.show { display: block; }

        .success {
            background: rgba(249, 115, 22, 0.15);
            border: 1px solid #f97316;
            color: #f97316;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 14px;
            margin-bottom: 20px;
            display: none;
        }

        .success.show { display: block; }
    </style>
</head>
<body>
    <div class="login-container">
        <a href="/" class="logo">
            <div class="logo-icon"><i class="fas fa-rocket"></i></div>
            Profit<span>Hub</span>
        </a>

        <div class="login-card">
            <h1>Welcome Back</h1>
            <p class="subtitle">Login to access your dashboard and offers</p>

            <div class="error" id="error"></div>
            <div class="success" id="success"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label>Email Address</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="email" placeholder="you@example.com" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" placeholder="Enter your password" required>
                    </div>
                </div>

                <div class="forgot">
                    <a href="#">Forgot Password?</a>
                </div>

                <button type="submit" class="btn" id="submitBtn">
                    <i class="fas fa-sign-in-alt"></i> Login
                </button>
            </form>

            <div class="divider"><span>or continue with</span></div>

            <div class="social-login">
                <button class="social-btn">
                    <i class="fab fa-google"></i>
                    <span>Google</span>
                </button>
                <button class="social-btn">
                    <i class="fab fa-github"></i>
                    <span>GitHub</span>
                </button>
            </div>

            <p class="register-link">
                Don't have an account? <a href="/register">Sign up free</a>
            </p>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const submitBtn = document.getElementById('submitBtn');
            const error = document.getElementById('error');
            
            error.classList.remove('show');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Logging in...';
            
            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await res.json();
                
                if (data.success) {
                    submitBtn.innerHTML = '<i class="fas fa-check"></i> Success!';
                    window.location.href = '/dashboard';
                } else {
                    error.textContent = data.error || 'Login failed';
                    error.classList.add('show');
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Login';
                }
            } catch (err) {
                error.textContent = 'Connection error. Please try again.';
                error.classList.add('show');
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Login';
            }
        });
    </script>
</body>
</html>
